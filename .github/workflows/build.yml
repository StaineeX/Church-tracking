# Adapted from obsproject/obs-plugintemplate build-project.yaml at
# 3e7d7ac3b5342cd7d9b88890b9c70b472d1520fc (GPL-2.0).
name: Build and test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: OBS-independent unit and layout tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install unit toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
      - name: Configure
        run: cmake --preset unit-tests
      - name: Build
        run: cmake --build --preset unit-tests
      - name: Test
        run: ctest --test-dir build/unit-tests --output-on-failure
      - name: Preserve unit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: church-director-unit-evidence
          path: |
            build/unit-tests/Testing/Temporary/LastTest.log
            build/unit-tests/CMakeCache.txt
          if-no-files-found: warn

  opencv-tests:
    name: OBS-independent OpenCV detector tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCV test toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libopencv-dev
      - name: Configure
        run: cmake --preset opencv-tests
      - name: Build
        run: cmake --build --preset opencv-tests
      - name: Test HOG detector
        run: ctest --test-dir build/opencv-tests -R person_detector --output-on-failure

  plugin-linux:
    name: OBS plugin build (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install supported plugin toolchain, libobs, and OpenCV
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/ci-logs
          if ! sudo apt-get update 2>&1 | tee build/ci-logs/apt-update.log; then
            echo 'UNAVAILABLE: Ubuntu package index could not be refreshed; no plugin build or OBS runtime claim.' | tee build/ci-logs/status.txt
            exit 1
          fi
          if ! sudo apt-get install -y cmake ninja-build g++ pkg-config libobs-dev libopencv-dev 2>&1 | tee build/ci-logs/dependencies.log; then
            echo 'DEPENDENCIES: UNAVAILABLE: Ubuntu 24.04 plugin toolchain, libobs-dev, or libopencv-dev could not be installed.' | tee build/ci-logs/status.txt
            echo 'BUILD: UNAVAILABLE: configure/build/install were not attempted.' | tee -a build/ci-logs/status.txt
            echo 'RUNTIME: UNAVAILABLE: no OBS runtime claim.' | tee -a build/ci-logs/status.txt
            exit 1
          fi
      - name: Configure and build plugin
        shell: bash
        run: |
          set -o pipefail
          if ! cmake --preset plugin-linux 2>&1 | tee build/ci-logs/configure.log; then
            echo 'DEPENDENCIES: AVAILABLE: package installation completed; inspect dependencies.log.' | tee build/ci-logs/status.txt
            echo 'CONFIGURE: FAILED/UNAVAILABLE: inspect configure.log for the exact dependency, toolchain, or project error.' | tee -a build/ci-logs/status.txt
            echo 'BUILD: UNAVAILABLE: compilation and install were not attempted.' | tee -a build/ci-logs/status.txt
            echo 'RUNTIME: UNAVAILABLE: no OBS runtime claim.' | tee -a build/ci-logs/status.txt
            exit 1
          fi
          if ! cmake --build --preset plugin-linux 2>&1 | tee build/ci-logs/build.log; then
            echo 'DEPENDENCIES: AVAILABLE: package installation completed; inspect dependencies.log.' | tee build/ci-logs/status.txt
            echo 'CONFIGURE: PASSED: inspect configure.log.' | tee -a build/ci-logs/status.txt
            echo 'BUILD: FAILED: plugin compilation/link failed; inspect build.log.' | tee -a build/ci-logs/status.txt
            echo 'INSTALL: UNAVAILABLE: staging was not attempted.' | tee -a build/ci-logs/status.txt
            echo 'RUNTIME: UNAVAILABLE: no OBS runtime claim.' | tee -a build/ci-logs/status.txt
            exit 1
          fi
          if ! cmake --install build/plugin-linux --prefix "$PWD/build/plugin-stage" 2>&1 | tee build/ci-logs/install.log; then
            echo 'DEPENDENCIES: AVAILABLE: package installation completed; inspect dependencies.log.' | tee build/ci-logs/status.txt
            echo 'CONFIGURE: PASSED: inspect configure.log.' | tee -a build/ci-logs/status.txt
            echo 'BUILD: PASSED: inspect build.log.' | tee -a build/ci-logs/status.txt
            echo 'INSTALL: FAILED: plugin stage install failed; inspect install.log.' | tee -a build/ci-logs/status.txt
            echo 'RUNTIME: UNAVAILABLE: no OBS runtime claim.' | tee -a build/ci-logs/status.txt
            exit 1
          fi
          echo 'DEPENDENCIES: PASSED: libobs-dev and libopencv-dev installed; inspect dependencies.log.' | tee build/ci-logs/status.txt
          echo 'CONFIGURE: PASSED: inspect configure.log.' | tee -a build/ci-logs/status.txt
          echo 'BUILD: PASSED: Linux plugin compiled; inspect build.log.' | tee -a build/ci-logs/status.txt
          echo 'INSTALL: PASSED: staged install created; inspect install.log.' | tee -a build/ci-logs/status.txt
          echo 'RUNTIME: UNAVAILABLE: OBS has no graphical runtime smoke session in CI; follow docs/smoke-tests/obs-real-camera.md.' | tee -a build/ci-logs/status.txt
      - name: Preserve plugin build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: church-director-plugin-linux-evidence
          path: |
            build/ci-logs/configure.log
            build/ci-logs/build.log
            build/ci-logs/install.log
            build/ci-logs/status.txt
            build/ci-logs/dependencies.log
            build/ci-logs/apt-update.log
            build/plugin-linux/CMakeCache.txt
            build/plugin-stage/
          if-no-files-found: warn
